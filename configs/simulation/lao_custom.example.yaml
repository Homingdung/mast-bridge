model: lao85
sampling:
  n_samples: 100
  seed: 42

# Use fixed numbers for a single profile, or {min, max} objects for sampling.
pprime_coefficients:
  - min: 0.8
    max: 1.5
  - min: -0.6
    max: -0.1
  - min: 0.0
    max: 0.2

ffprime_coefficients:
  - min: 0.7
    max: 1.1
  - min: 0.0
    max: 0.3
  - min: -0.1
    max: 0.05
